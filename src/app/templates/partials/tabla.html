{% macro tabla(headers, rows, caption=None) %}
<div class="table-wrap">
  <table class="data-table">
    {% if caption %}<caption>{{ caption }}</caption>{% endif %}
    <thead>
      <tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endmacro %}
